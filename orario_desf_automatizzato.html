<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabellone Orari DESF Automatizzato - Prototipo 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .top-navbar {
            background: #1a365d;
            color: white;
            padding: 15px 0;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .nav-tabs-pills {
            border: none;
            gap: 8px;
            margin-bottom: 25px;
        }
        .nav-tabs-pills .nav-link {
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 700;
            color: #475569;
            background: #ffffff;
            transition: all 0.2s ease;
        }
        .nav-tabs-pills .nav-link:hover {
            border-color: #1a365d;
            color: #1a365d;
            background: #f1f5f9;
        }
        .nav-tabs-pills .nav-link.active {
            background: #1a365d !important;
            color: #ffffff !important;
            border-color: #1a365d !important;
            box-shadow: 0 4px 8px rgba(26,54,93,0.3);
        }
        .course-card {
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            overflow: hidden;
        }
        .course-card-header {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            padding: 14px 20px;
        }
        .badge-triennale {
            background-color: #0284c7;
            color: white;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .badge-magistrale {
            background-color: #c026d3;
            color: white;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .table-custom {
            margin: 0;
        }
        .table-custom th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 700;
            font-size: 0.88rem;
            text-transform: uppercase;
        }
        .time-box {
            font-weight: 700;
            color: #0f172a;
            background: #f8fafc;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            display: inline-block;
        }
        .room-tag {
            background: #dcfce7;
            color: #166534;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #86efac;
            display: inline-block;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="top-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h3 class="m-0 font-weight-bold"><i class="fa-solid fa-university me-2"></i>Dipartimento DESF - UniCal</h3>
            <small class="text-white-50">Programmazione Orario Lezioni A.A. 2026/2027</small>
        </div>
        <div>
            <span class="badge bg-success px-3 py-2"><i class="fa-solid fa-arrows-rotate me-1"></i>Sincronizzato API</span>
        </div>
    </div>
</div>

<div class="container">
    <!-- Filtri e Cerca -->
    <div class="row g-3 mb-4">
        <div class="col-md-7">
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Cerca insegnamento, docente o aula...">
            </div>
        </div>
        <div class="col-md-5">
            <select id="yearSelect" class="form-select form-select-lg">
                <option value="ALL">Tutti gli Anni di Corso</option>
                <option value="1° anno">1° Anno</option>
                <option value="2° anno">2° Anno</option>
                <option value="3° anno">3° Anno</option>
            </select>
        </div>
    </div>

    <!-- Schede dei Corsi (Prototipo 2) -->
    <ul class="nav nav-tabs-pills nav-tabs flex-nowrap overflow-auto" id="cdlTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="tab-ECONOMIA" data-bs-toggle="tab" data-bs-target="#pane-ECONOMIA" type="button">
                <i class="fa-solid fa-chart-pie me-1"></i> Economia (L-33)
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-SDS" data-bs-toggle="tab" data-bs-target="#pane-SDS" type="button">
                <i class="fa-solid fa-chart-line me-1"></i> Statistica Data Science (L-41)
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-EIS" data-bs-toggle="tab" data-bs-target="#pane-EIS" type="button">
                <i class="fa-solid fa-leaf me-1"></i> Economia & Sostenibilità (LM-56)
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-DSSA" data-bs-toggle="tab" data-bs-target="#pane-DSSA" type="button">
                <i class="fa-solid fa-network-wired me-1"></i> Data Science Strategie (LM-91)
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-FINANCE" data-bs-toggle="tab" data-bs-target="#pane-FINANCE" type="button">
                <i class="fa-solid fa-coins me-1"></i> Finance & Insurance (LM-16)
            </button>
        </li>
    </ul>

    <!-- Contenuto Tab -->
    <div class="tab-content" id="cdlTabsContent">
        <div class="tab-pane fade show active" id="pane-ECONOMIA"></div>
        <div class="tab-pane fade" id="pane-SDS"></div>
        <div class="tab-pane fade" id="pane-EIS"></div>
        <div class="tab-pane fade" id="pane-DSSA"></div>
        <div class="tab-pane fade" id="pane-FINANCE"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let rawData = [];

const COURSES = [
    { code: 'ECONOMIA', name: 'Corso di Laurea Triennale in Economia (L-33)', type: 'Triennale', years: ['1° anno', '2° anno', '3° anno'] },
    { code: 'SDS', name: 'Corso di Laurea Triennale in Statistica per Data Science (L-41)', type: 'Triennale', years: ['1° anno', '2° anno', '3° anno'] },
    { code: 'EIS', name: 'Corso di Laurea Magistrale in Economia, Imprese e Sostenibilità (LM-56)', type: 'Magistrale', years: ['1° anno', '2° anno'] },
    { code: 'DSSA', name: 'Corso di Laurea Magistrale in Data Science per le Strategie Aziendali (LM-91)', type: 'Magistrale', years: ['1° anno', '2° anno'] },
    { code: 'FINANCE', name: 'Corso di Laurea Magistrale in Finance and Insurance (LM-16)', type: 'Magistrale', years: ['1° anno', '2° anno'] }
];

document.addEventListener('DOMContentLoaded', () => {
    fetch('lessons_data.json')
        .then(r => r.json())
        .then(data => {
            rawData = data;
            renderAll();
        });

    document.getElementById('searchInput').addEventListener('input', renderAll);
    document.getElementById('yearSelect').addEventListener('change', renderAll);
});

function renderAll() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const selYear = document.getElementById('yearSelect').value;

    COURSES.forEach(course => {
        const pane = document.getElementById(`pane-${course.code}`);
        const filtered = rawData.filter(item => {
            const matchCode = item.cdl_code === course.code;
            const matchQ = (item.materia || '').toLowerCase().includes(q) ||
                           (item.docente || '').toLowerCase().includes(q) ||
                           (item.aula || '').toLowerCase().includes(q);
            const matchYear = selYear === 'ALL' || item.anno === selYear;
            return matchCode && matchQ && matchYear;
        });

        if (filtered.length === 0) {
            pane.innerHTML = `<div class="alert alert-secondary text-center py-4 my-3">Nessun orario presente per questo corso con i filtri inseriti.</div>`;
            return;
        }

        let html = `<div class="d-flex align-items-center mb-3">
                        <h4 class="m-0 font-weight-bold me-2" style="color:#1a365d;">${course.name}</h4>
                        <span class="${course.type === 'Triennale' ? 'badge-triennale' : 'badge-magistrale'}">${course.type}</span>
                    </div>`;

        course.years.forEach(yr => {
            if (selYear !== 'ALL' && selYear !== yr) return;
            const yrLessons = filtered.filter(l => l.anno === yr);
            if (yrLessons.length === 0) return;

            html += `
            <div class="course-card">
                <div class="course-card-header d-flex justify-content-between align-items-center">
                    <h5 class="m-0 font-weight-bold" style="color:#0f172a;"><i class="fa-solid fa-graduation-cap me-2 text-primary"></i>${yr}</h5>
                    <span class="badge bg-secondary">${yrLessons.length} lezioni</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle">
                        <thead>
                            <tr>
                                <th style="width: 120px;">Data</th>
                                <th style="width: 110px;">Giorno</th>
                                <th style="width: 140px;">Orario</th>
                                <th>Insegnamento</th>
                                <th>Docente</th>
                                <th>Aula / Ubicazione</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${yrLessons.map(l => `
                                <tr>
                                    <td><strong>${l.data}</strong></td>
                                    <td><span class="badge bg-light text-dark border">${l.giorno}</span></td>
                                    <td><span class="time-box"><i class="fa-regular fa-clock me-1"></i>${l.orario}</span></td>
                                    <td class="fw-bold text-primary">${l.materia}</td>
                                    <td><i class="fa-solid fa-user-tie me-1 text-muted"></i>${l.docente}</td>
                                    <td><span class="room-tag"><i class="fa-solid fa-location-dot me-1"></i>${l.aula}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        });

        pane.innerHTML = html;
    });
}
</script>
</body>
</html>
