eria": "Financial Markets", "docente": "B. Algieri", "aula": "Aula EP5 (Cubo 1D)"}, {"sheet": "Finance II", "cdl": "Finance and Insurance", "anno": "2° anno", "color": "#9f1239", "giorno": "Martedì", "orario": "14:00 - 16:00", "materia": "Financial Reporting", "docente": "D. Ferrari", "aula": "Aula EP5 (Cubo 1D)"}, {"sheet": "Finance II", "cdl": "Finance and Insurance", "anno": "2° anno", "color": "#9f1239", "giorno": "Mercoledì", "orario": "14:00 - 16:00", "materia": "Risk Theory", "docente": "A. Staino", "aula": "Laboratorio statistico-informatico (Cubo 3D)"}];
        let pages = [], pIdx = 0;

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('it-IT');
            document.getElementById('date').innerText = now.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const days = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
            const today = days[now.getDay()];
            if (window.curDay !== today) { window.curDay = today; buildPages(today); }
        }

        function buildPages(day) {
            document.getElementById('dayName').innerText = day.toUpperCase();
            const dayLessons = lessons.filter(l => l.giorno.toLowerCase() === day.toLowerCase());
            dayLessons.sort((a,b) => a.cdl.localeCompare(b.cdl) || a.orario.localeCompare(b.orario));

            pages = [];
            for (let i = 0; i < dayLessons.length; i += 5) {
                pages.push(dayLessons.slice(i, i + 5));
            }
            pIdx = 0;
            render();
        }

        function render() {
            const box = document.getElementById('mainBox');
            box.innerHTML = '';
            if (pages.length === 0) {
                document.getElementById('pBadge').innerText = 'PAGINA 1 / 1';
                box.innerHTML = '<div style="text-align:center; font-size:3rem; padding:100px; color:#64748b;">NESSUNA LEZIONE OGGI</div>';
                return;
            }
            document.getElementById('pBadge').innerText = `PAGINA ${pIdx + 1} DI ${pages.length}`;
            const items = pages[pIdx];

            items.forEach(it => {
                const row = document.createElement('div');
                row.className = 'row-card';
                row.innerHTML = `
                    <div class="cdl-badge" style="background-color:${it.color || '#7c3aed'}">${it.cdl} (${it.anno})</div>
                    <div class="time">${it.orario}</div>
                    <div class="materia">${it.materia}</div>
                    <div class="docente">${it.docente || 'Docente tbd'}</div>
                    <div class="aula">${it.aula || 'Aula tbd'}</div>`;
                box.appendChild(row);
            });
        }

        function rotate() {
            if (pages.length > 1) {
                pIdx = (pIdx + 1) % pages.length;
                render();
            }
        }

        updateClock(); setInterval(updateClock, 1000);
        setInterval(rotate, 18000);
    </script>
