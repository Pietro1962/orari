name: Aggiornamento Automatico Orari Cineca

on:
  schedule:
    # Esegue l'aggiornamento automatico ogni notte alle 02:00
    - cron: '0 2 * * *'
  workflow_dispatch: # Permette l'avvio manuale con un click

permissions:
  contents: write

jobs:
  update-schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scarica orari aggiornati da UP Cineca
        run: python fetch_schedules.py

      - name: Salva e pubblica aggiornamenti
        run: |
          git config --global user.name 'GitHub Automation'
          git config --global user.email 'automation@github.com'
          git add lessons_data.json
          git commit -m "Auto-update orari lezioni A.A. 2026/2027" || exit 0
          git push
