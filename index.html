<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORARIO DESF PRIMO SEMESTRE 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #020617; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER MASSIMIZZATO */
        header { background: linear-gradient(135deg, #0f172a, #1e1b4b); padding: 18px 35px; display: flex; justify-content: space-between; align-items: center; border-bottom: 8px solid #38bdf8; }
        .title-box h1 { font-size: 3.8rem; color: #38bdf8; font-weight: 900; line-height: 1.05; }
        .title-box p { color: #cbd5e1; font-size: 2.2rem; font-weight: 800; margin-top: 4px; }
        #live-clock { font-size: 6.0rem; font-weight: 900; color: #facc15; font-family: monospace; line-height: 1; }
        #live-date { font-size: 2.2rem; color: #38bdf8; text-transform: capitalize; font-weight: 800; margin-top: 4px; }
        
        /* BARRA PULSANTI PER I 6 GIORNI */
        .controls-bar { background: #0f172a; padding: 12px 20px; display: flex; justify-content: space-between; gap: 12px; border-bottom: 6px solid #1e293b; }
        .day-btn { flex: 1; background: #1e293b; color: #94a3b8; border: 4px solid #334155; padding: 12px 0; font-size: 2.5rem; font-weight: 900; border-radius: 14px; cursor: pointer; text-transform: uppercase; text-align: center; }
        .day-btn.active { background: #2563eb; color: #fff; border-color: #60a5fa; box-shadow: 0 0 25px rgba(37,99,235,0.9); }
        
        /* TABELLA MAXI */
        .scroll-container { flex: 1; overflow-y: hidden; padding: 20px 25px; }
        .schedule-table { width: 100%; border-collapse: separate; border-spacing: 0 18px; }
        .schedule-table th { background: #0f172a; color: #38bdf8; padding: 18px 25px; font-size: 3.0rem; text-align: left; border-bottom: 6px solid #0284c7; font-weight: 900; }
        .schedule-row { background: linear-gradient(90deg, #0f172a, #1e293b); border-radius: 18px; }
        .schedule-row td { padding: 22px 25px; vertical-align: middle; }
        .schedule-row td:first-child { width: 30%; background: #030712; border-left: 16px solid #38bdf8; border-radius: 18px 0 0 18px; }
        
        .aula-title { font-size: 3.8rem; font-weight: 900; color: #38bdf8; line-height: 1.05; }
        .time-cell { width: 22%; font-weight: 900; color: #facc15; font-family: monospace; font-size: 4.4rem; }
        .course-cell { width: 48%; font-weight: 800; font-size: 3.6rem; line-height: 1.15; }
        .badge-seats { background-color: #312e81; color: #e0e7ff; padding: 6px 18px; border-radius: 10px; font-size: 2.0rem; font-weight: 800; display: inline-block; margin-top: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="title-box">
            <h1>ORARIO LEZIONI - AULE DESF</h1>
            <p>Dipartimento di Economia, Statistica e Finanza - Primo Semestre 2026</p>
        </div>
        <div style="text-align:right;">
            <div id="live-clock">--:--:--</div>
            <div id="live-date">---</div>
        </div>
    </header>
    <div class="controls-bar">
        <button class="day-btn" onclick="selectDay('lunedì')">Lunedì</button>
        <button class="day-btn" onclick="selectDay('martedì')">Martedì</button>
        <button class="day-btn" onclick="selectDay('mercoledì')">Mercoledì</button>
        <button class="day-btn" onclick="selectDay('giovedì')">Giovedì</button>
        <button class="day-btn" onclick="selectDay('venerdì')">Venerdì</button>
        <button class="day-btn" onclick="selectDay('sabato')">Sabato</button>
    </div>
    <div class="scroll-container" id="scrollContainer">
        <table class="schedule-table">
            <thead>
                <tr><th>Aula</th><th>Orario</th><th>Insegnamento / Docente</th></tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>
    <script>
        const scheduleData = [

            // --- AULA CONS 2C ---
            {
                aula: "CONS 2C (già CONS 1)",
                posti: "350",
                orario: "09:00-11:00",
                "lunedì":    "[III 0744] Tecnica e Gestione degli Investimenti (Fasano)",
                "martedì":   "[III 0744] Tecnica e Gestione degli Investimenti (Fasano)",
                "mercoledì": "[III 0744] Tecnica e Gestione degli Investimenti (Fasano)",
                "giovedì":   "[II 0844] Matematica Finanziaria (Russo)",
                "venerdì":   "[II 0844] Matematica Finanziaria (Russo)",
                "sabato":    "DIDDI 9-12"
            },
            {
                aula: "CONS 2C (già CONS 1)",
                posti: "350",
                orario: "11:00-13:00",
                "lunedì":    "[I 0844] Microeconomia - aula 2 (Nisticò)",
                "martedì":   "[I 0844] Microeconomia - aula 2 (Nisticò)",
                "mercoledì": "[I 0844] Microeconomia - aula 1 (Trivieri)",
                "giovedì":   "[II 0844] Diritto pubblico (Adamo)",
                "venerdì":   "DESF",
                "sabato":    "DIDDI 9-12"
            },
            {
                aula: "CONS 2C (già CONS 1)",
                posti: "350",
                orario: "14:00-16:00",
                "lunedì":    "MAZZUCA",
                "martedì":   "STAT AULA 1",
                "mercoledì": "FERRARO RAG",
                "giovedì":   "DIDDI 15-18",
                "venerdì":   "DIDDI 15-18",
                "sabato":    ""
            },
            {
                aula: "CONS 2C (già CONS 1)",
                posti: "350",
                orario: "16:00-18:00",
                "lunedì":    "COSTANZO EA",
                "martedì":   "FAVA",
                "mercoledì": "[II 0844] Diritto pubblico (Adamo)",
                "giovedì":   "DIDDI 15-18",
                "venerdì":   "DIDDI 15-18",
                "sabato":    ""
            },

            // --- AULA CONS 5B1 ---
            {
                aula: "CONS 5B1 (già CONS 4)",
                posti: "260",
                orario: "09:00-11:00",
                "lunedì":    "[I 0844] Metodi matematici per l'economia aula 1 (De Maio)",
                "martedì":   "[I 0844] Metodi matematici per l'economia aula 1 (De Maio)",
                "mercoledì": "[I 0844] Metodi matematici per l'economia aula 1 (De Maio)",
                "giovedì":   "PILUSO",
                "venerdì":   "MAZZOTTA",
                "sabato":    ""
            },

            // --- AULA EP1 ---
            {
                aula: "EP1",
                posti: "149",
                orario: "09:00-11:00",
                "lunedì":    "[I 0844] Metodi matematici per l'economia aula 2 (Scopelliti)",
                "martedì":   "[I 0844] Metodi matematici per l'economia aula 2 (Scopelliti)",
                "mercoledì": "[I 0844] Metodi matematici per l'economia aula 2 (Scopelliti)",
                "giovedì":   "LA ROCCA",
                "venerdì":   "LA ROCCA",
                "sabato":    ""
            },

            // --- AULA EP2 ---
            {
                aula: "EP2",
                posti: "108",
                orario: "09:00-11:00",
                "lunedì":    "[II 0844] Statistica ed elementi di Inferenza (Cossari/Cozzucoli)",
                "martedì":   "[I 0848] Modelli statistici e Statistical Learning (Domma)",
                "mercoledì": "[II 0844] Statistica ed elementi di Inferenza (Cossari/Cozzucoli)",
                "giovedì":   "[II 0846] Economia delle risorse naturali e della transizione ecologica (Agostino)",
                "venerdì":   "[III 0744] Economia Pubblica",
                "sabato":    ""
            }

        ];

        let currentDay = 'lunedì', scrollInterval = null;

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('it-IT');
            document.getElementById('live-date').innerText = now.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function selectDay(d) {
            currentDay = d;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase() === d));
            render();
        }

        function render() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            let found = false;

            scheduleData.forEach(item => {
                let info = item[currentDay];
                if (info && info.trim()) {
                    found = true;
                    let tr = document.createElement('tr');
                    tr.className = 'schedule-row';
                    tr.innerHTML = `<td><div class="aula-title">${item.aula}</div><span class="badge-seats">${item.posti} POSTI</span></td><td class="time-cell">${item.orario}</td><td class="course-cell">${info}</td>`;
                    tbody.appendChild(tr);
                }
            });

            if (!found) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; font-size:4rem; padding:80px; color:#94a3b8;">Nessuna lezione in programma per la giornata selezionata.</td></tr>';
            }
            
            const container = document.getElementById('scrollContainer');
            container.scrollTop = 0;
            startAutoScroll();
        }

        function startAutoScroll() {
            const container = document.getElementById('scrollContainer');
            if (scrollInterval) clearInterval(scrollInterval);
            
            setTimeout(() => {
                scrollInterval = setInterval(() => {
                    if (container.scrollHeight > container.clientHeight) {
                        container.scrollTop += 2.0;
                        if (container.scrollTop + container.clientHeight >= container.scrollHeight - 2) {
                            setTimeout(() => { container.scrollTop = 0; }, 2000);
                        }
                    }
                }, 20);
            }, 1500);
        }

        function initDaySelection() {
            const now = new Date();
            const days = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
            let today = days[now.getDay()];
            if (today === 'domenica') today = 'lunedì';
            selectDay(today);
        }

        document.querySelectorAll('.day-btn').forEach(b => b.addEventListener('click', () => window.manual = true));
        
        updateClock(); 
        setInterval(updateClock, 1000);
        initDaySelection();
    </script>
</body>
</html>
